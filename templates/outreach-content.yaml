# 아키타입 S — 연구 성과 발신(멀티채널 아웃리치) 12단계
# 출처: other_projects/harness-templates/research-harnesses/project_outreachforge
#       (.claude/skills/outreachforge/SKILL.md 8-stage + agents 12종). 변환 절차: docs/13
#
# 이 아키타입이 만드는 것: **바로 올릴 수 있는 멀티채널 발신물**이다. 논문·시스템·데이터셋·
# 재현 패키지를 받아 핵심 주장을 뽑고, 후킹 문구를 설계하고, 채널별로 병렬 집필해
# (X 스레드 · 블로그 · README PR) 그림 브리프·인용팩·발신 체크리스트와 함께 번들로 낸다.
# 아키타입 B·M·N·O·P 의 산출물을 받는다.
#
# ⚠️ **이 아키타입만 목적이 '공개' 다 — 그래서 무엇을 공개해도 되는지 먼저 물어야 한다.**
#    Q·R 은 산출물을 감추는 것이 규율이었지만, 여기서는 감추는 것이 아니라 **공개해도 되는
#    것만 공개하는 것**이 규율이다. 원본에는 이 질문이 **한 번도 나오지 않는다.** 그런데
#    입력에는 심사 중 원고(아키타입 R 의 입력) · **출원 전 발명**(아키타입 F 와 정면 충돌 —
#    공개하면 신규성을 잃는다) · 엠바고가 걸린 공동연구 결과가 섞인다.
#    → `release_readiness` 를 신설해 **공개 근거를 선언하게 하고**(fail-closed) 엠바고·특허
#      상태와 발신일을 대조한다. 그리고 **우리는 게시하지 않는다** — 사람이 올린다.
#
# 변환 판단(요약 — 상세·근거는 docs/13 §2·§5):
#  - **원본 게이트 2종에서 결함 6건을 실측**했다. 가장 큰 것 둘:
#      · 지어낸 "**8배** 빠르다" 가 원자료의 `0.873` 안에 있는 `8` 로 통과한다(숫자를
#        문자열로 찾는다). **공개되는 수치라 되돌릴 수 없다.**
#      · "Our method is the **first ever to beat human experts**" 가 원자료에 `method` 라는
#        단어가 있다는 이유로 통과한다(최상급은 단어 하나만 겹치면 된다).
#  - 과장 임계가 채널당 **5건**이라 "획기적이고 혁명적인 놀라운 breakthrough 이며 전례없는"
#    한 문장이 PASS 다. `HYPE_WARN = 2` 는 판정에 쓰이지 않는 **죽은 상수**였다.
#  - **거짓 FAIL 2건**: 채널 목록이 하드코딩돼 X 스레드만 만드는 미션이 반려된다 ·
#    Medium 분량이 영문 word 기준이라 **정상 국문 글(1,164 어절 ≈ 영문 1,690 words)이
#    '미달'로 반려**된다(한국어 재보정 세 번째).
#  - **재사용 2종**: `evidence_grade`(아키타입 G) — claim 에 등급을 달면 **예비 결과를
#    확정처럼 말하는 것**을 그 게이트가 그대로 잡는다(하는 일이 같다) · `secret_redaction`(L).
#  - `cite_pack_build.py`·`bundle_export.py`·`runs_state.py` 는 미이식(산출 도구 · Kanban).
#
# 스키마 규약은 templates/trend-report.yaml 머리말 참조.

name: outreach-content
category: research
display_name: 연구 성과 발신(X 스레드·블로그·README 동시 산출)
maturity: draft
goal_kr: 연구 산출물에서 검증된 주장만 뽑아 채널 규격에 맞는 발신물을 만들고 공개 근거와 발신 체크리스트를 붙여 사람이 바로 올릴 수 있게 낸다.
requires_profiles: []
invariants: [scoping_gate, deliver_gate, writer_ne_reviewer, factchecker_ne_reader, revision_loop]

policy:
  # ── 공개 범위 — 기본은 비공개다. 원자료가 이미 공개된 경우에만 커밋을 허용한다 ────────
  publication_policy:
    mode: local_only            # release_basis 가 arxiv·doi·github_release 면 repo_commit 가능
    private_dir: _private
    content_files: [channels, source.md, visuals.md, launch-checklist.md]

  # ── 신설: 공개 준비(원본에 이 질문이 없다) ──────────────────────────────────
  release_policy:
    allowed_basis: [arxiv, doi, github_release, public_dataset, owner_approval]
    public_basis: [arxiv, doi, github_release, public_dataset]   # 커밋을 허용하는 근거
    require_launch_date: true
    checklist_file: _private/launch-checklist.md
    visuals_file: _private/visuals.md
    scan_dirs: [_private/channels]
    require_visual_rights: true
    placeholder_terms: [TBD, TODO, FIXME, "<URL>", "<링크>", "@handle", "@yourhandle",
                        example.com, xxx, 작성 예정, 미정]
    disclaimer_terms:
      - "게시는 저자가 직접"
      - "이 파이프라인은 게시하지"
      - "사람이 최종 확인"

  # ── 이식한 HARD GATE(사실성) — 판정 방식을 바꿨다 ───────────────────────────
  claim_policy:
    source_file: _private/source.md
    channels_dir: _private/channels
    source_dir: _private/source
    min_claims: 3
    require_locator: true
    require_value_in_source: true
    # ⚠️ 인용은 **수치가 있는 문단 안**에 있어야 한다. 처음 '주변 220자' 창으로 뒀더니
    #    X 스레드에서 **옆 트윗의 인용**이 창에 들어와 출처 없는 수치가 통과했다(픽스처가 잡았다).

  # ── 이식한 채널 규격 — 하드코딩 제거 + 국문 재보정 ──────────────────────────
  channel_policy:
    channels_dir: _private/channels
    channels: [twitter, medium, readme]   # SCOPE.md frontmatter 의 `channels:` 가 우선
    specs:
      twitter: {min_posts: 5, max_posts: 8, max_chars: 280,
                require_numbering: true, require_cta: true}
      # ⚠️ 국문 어절 기준(영문 1500~3000 words ÷ 1.45). 원본 수치를 그대로 쓰면 정상 글이
      #    분량 미달로 반려된다(실측: 영문 1,690 words 에 해당하는 국문 1,164 어절이 FAIL).
      medium: {word_range: [900, 2100], min_headings: 3, max_headings: 6,
               require_hero: true}
      readme: {min_diff_lines: 5, require_bilingual: true, require_bibtex: true}

  # ── 신설: 발신 톤(원본 크리틱에 스크립트가 없다) ────────────────────────────
  tone_policy:
    channels_dir: _private/channels
    max_hype_per_channel: 1     # ⚠️ 원본은 5였다(한 문장에 다섯 개를 넣어도 통과)
    max_emoji_per_post: 2
    max_hashtags_per_post: 3
    max_allcaps_words: 2

  # ── 재사용: 주장 등급 ↔ 유보 표현(아키타입 G) ───────────────────────────────
  # claim 에 `grade:` 를 달면 **예비 결과를 확정처럼 말하는 것**을 이 게이트가 그대로 잡는다.
  # 발신물에서 가장 흔한 사고이고, policyforge 의 '저근거 권고' 와 하는 일이 같다.
  evidence_policy:
    evidence_file: source.md         # evidence_grade 는 draft(channels/)의 상위에서 찾는다
    caveat_grades: [preliminary, low, very_low]
    caveat_terms: [예비, 잠정, 초기 결과, 추가 검증, 한계, preliminary, early, may, suggest]
    min_refs_per_format: 1
    recommendation_required_in: []   # 발신물에는 '권고 절' 이 없다 — 이 축은 끈다
    strong_grades: [verified, high, moderate]

  # ── 재사용: 비밀값(아키타입 L) — 발신물에는 예제 코드와 URL 이 들어간다 ──────
  redaction_policy:
    require_disclaimer: false        # 고지는 release_readiness 가 체크리스트에서 강제한다
    block_secrets: true
    scan_extensions: [".md"]

stages:
  - id: 1
    name: Scoping
    profile: default          # Solomon
    sam_gate: true
    upstream: []
    body: "미션 스펙을 reports/<MID>/SCOPE.md 에 작성한다. **frontmatter 에 다음을 반드시 선언하라 — 게이트가 이 값으로 공개 가능 여부를 판정한다**:\n```\nchannels: [twitter, medium, readme]   # 만들 채널만 적어라. 적지 않은 채널은 만들지 않는다\nrelease_basis: arxiv                  # arxiv | doi | github_release | public_dataset | owner_approval\nrelease_ref: 2601.01234               # 근거의 실체(id·URL·태그)\npatent_status: none                   # none | filed | planned\nlaunch_date: 2026-09-01\nembargo_until:                        # 있으면 적는다(발신일과 대조된다)\n```\n⚠️ **이 아키타입은 공개가 목적이다 — 그래서 무엇을 공개해도 되는지 먼저 묻는다.** Sam 에게 확인하라: ① 원자료가 **이미 공개**됐는가(arXiv·DOI·릴리스). 아니면 무엇을 근거로 공개하는가. ② **출원 예정 발명이 섞여 있지 않은가** — `patent_status: planned` 면 게이트가 막는다(공개하면 신규성을 잃는다). ③ 공동연구자·기관의 **엠바고**가 있는가. ④ 심사 중인 원고의 결과를 말하는가. ⚠️ **우리는 게시하지 않는다** — 산출물은 초안이고 실제 게시는 사람이 한다. ⚠️ 원자료는 `_private/source/` 에 둔다. ⚠️ 파이프라인 카드는 이미 생성돼 있다 — 하위 task를 새로 만들거나 kanban decompose 하지 마라."
  - id: 2
    name: Source Ingest
    profile: reader
    upstream: [1]
    body: "원자료를 읽어 발신할 **주장**을 `_private/source.md` 에 정리한다. **블록 형식을 정확히 지켜라**(게이트 두 개가 읽는다):\n```evidence\n- id: e1\n  grade: verified          # verified | high | moderate | preliminary | low\n  value: 0.873             # 발신물에 쓸 수 있는 수치(게이트가 채널의 숫자와 대조한다)\n  locator: _private/source/results.md\n  statement: 국내 산업 데이터에서 정확도 0.873 을 얻었다\n```\n⚠️ **모든 claim 에 `locator:` 를 달아라** — 원자료의 어디서 나온 값인지 밝히지 않은 주장은 게이트가 반려한다. ⚠️ **값을 지어내지 마라.** 게이트가 원자료 전문에서 그 값을 다시 찾는다(원본은 숫자 한 글자만 걸쳐도 통과시켰다 — `0.873` 안의 `8` 로 '8배' 가 통과했다). ⚠️ **`grade:` 를 정직하게 달아라** — 예비 결과를 `verified` 로 올리면 뒤에서 유보 표현 검사가 무력해지고, 그것이 발신물에서 가장 흔한 사고다. ⚠️ 그림 후보도 함께 적되 **출처와 라이선스**를 반드시 기록하라(남의 그림은 그냥 쓸 수 없다)."
  - id: 3
    name: Source Verify
    profile: fact-checker      # ≠ reader
    verifier: true
    upstream: [2]
    gate:
      objective: [claim_provenance]
      llm: fact_checker_verdict
      draft: "reports/<MID>"
    body: "**채널을 쓰기 전에** 주장이 사실인지 검증한다(객관 게이트는 source 모드로 돌아 claim 의 원자료 실재를 본다). ⚠️ **이 검증이 앞에 있는 이유**: 틀린 수치 하나가 세 채널로 복제되고, 그 다음은 **공개**다. 되돌릴 수 없다. 사람이 읽어야 할 것: ① **값의 맥락** — 0.873 이 어떤 조건에서 나온 값인가(게이트는 문자열 일치만 본다). 조건을 빼고 말하면 숫자가 맞아도 거짓이 된다. ② **등급의 정직성** — `verified` 로 단 것이 정말 검증된 것인가(단일 실험·단일 시드 결과가 아닌가). ③ **비교 주장의 근거** — '가장 빠르다'를 말하려면 무엇과 비교했는지가 원자료에 있어야 한다. ④ **원자료 자체의 공개 가능성**(심사 중인가·출원 전인가). 끝에 VERDICT: PASS|FAIL."
  - id: 4
    name: Hook Design
    profile: synthesizer
    upstream: [3]              # 게이트: 3 PASS 시 게이트키퍼가 unblock
    body: "발신의 뼈대를 `_private/hook.md` 에 설계한다 — **한 줄 요약**(무엇을 왜 했고 무엇이 달라졌는가) · 채널별 후킹 문구(X 는 영문 280자 이내 · 블로그는 국문 100자 안팎 · README 는 한 줄 소개와 배지) · **말하지 않을 것**(과장하기 쉬운 지점을 미리 적어 둔다). ⚠️ **후킹은 claim 안에서 만들어라** — 여기서 만든 문구가 그대로 채널로 간다. claim 에 없는 수치·비교를 후킹에 넣으면 다음 게이트가 전부 반려한다. ⚠️ Sam 이 다음 단계에서 이 문서를 보고 집필 개시를 승인한다 — **어떤 인상을 남길 것인가**가 여기서 정해지므로 솔직하게 적어라."
  - id: 5
    name: Channel Write
    profile: writer
    sam_gate: true             # 어떤 인상을 남길지는 사람의 판단이다 — 집필 개시 전에 정한다
    approval_artifact: "reports/<MID>/_private/hook.md"
    upstream: [4]
    parallel:
      mode: workers
      # 채널마다 같은 계약(같은 주장을 그 플랫폼의 규격으로 쓴다) = profile 아님, 워커다.
      workers: [twitter, medium, readme]
      batch_size: 3
      shard: "_private/channels/<worker>.md"
      merge_to: null           # 채널 문서는 각자 독립 제출물이다
    body: "SCOPE.md 의 `channels` 에 **선언된 채널만** 쓴다(선언 밖의 채널을 만들면 게이트가 반려한다 — 어디에 발신할지는 Scoping 에서 정한다). 채널별 규격: **twitter**=영문 스레드 5~8개, 각 트윗은 `## 1/N` 제목으로 시작하고 280자 이내(URL 은 23자로 센다), 마지막 트윗에 CTA(링크 또는 해시태그) · **medium**=국문 블로그 900~2100 어절, 소제목 3~6개, 맨 앞에 `> Hero image hint: …` · **readme**=국·영문 병기 PR diff(`+` 로 시작하는 추가 줄 5줄 이상) + BibTeX 인용 블록.\n⚠️ **모든 수치와 최상급 표현에 claim 을 인용하라**(`[e1]`) — 게이트가 수치가 그 claim 의 값과 **같은지**까지 본다. ⚠️ **예비 등급(`preliminary`) claim 을 인용한 문장에는 유보 표현을 같은 문단에** 넣어라('예비', '잠정', '추가 검증 필요'). ⚠️ **과장 표현은 채널당 1건까지다**('획기적'·'혁명적'·'breakthrough'·'놀라운'). 원본은 5건까지 허용해 한 문장에 다섯 개를 넣어도 통과했다. ⚠️ 이모지는 글당 2개, 해시태그는 3개까지. ⚠️ **플레이스홀더를 남기지 마라**(`TBD`·`@handle`·`example.com`) — 그대로 게시되면 되돌릴 수 없다."
  - id: 6
    name: Visual·Cite Pack
    profile: curator
    upstream: [5]
    body: "① `_private/visuals.md` 에 그림 브리프를 정리한다. **형식을 지켜라**(게이트가 권리를 확인한다):\n```visuals\n- id: v1\n  channel: twitter\n  description: 정확도 비교 막대그림\n  source: _private/source/figures/fig2.png\n  license: own            # own | CC-BY-4.0 | 인용허락 … 반드시 적는다\n```\n② `_private/cite-pack.md` 에 **claim ↔ 채널 문장 ↔ 원자료** 매핑표를 만든다(채널마다 어떤 claim 을 어디에 썼는지). ⚠️ **남의 그림은 그냥 쓸 수 없다** — 자작이 아니면 라이선스와 출처 표기를 적고, 표기만으로 부족한 라이선스면 쓰지 마라. ⚠️ 채널 간 **같은 claim 을 다르게 말하고 있지 않은지** 대조하라(X 에서는 단정하고 블로그에서는 유보하는 일이 흔하다)."
  - id: 7
    name: Fact Verify
    profile: fact-checker      # ≠ curator
    verifier: true
    upstream: [6]
    gate:
      objective: [claim_provenance, channel_format, evidence_grade]
      llm: fact_checker_verdict
      draft: "reports/<MID>/_private/channels"
    body: "발신물의 **사실성과 규격**을 검증한다(객관 게이트: 수치↔claim 값 일치·최상급 인용·채널 규격·등급↔유보 표현). 사람이 읽어야 할 것: ① **맥락 삭제** — 수치는 맞는데 조건이 빠져 과장이 된 곳(게이트가 못 본다). ② **채널 간 강도 차이** — 같은 결과를 X 에서는 단정하고 블로그에서는 유보하지 않는가. ③ **인용의 적절성** — 인용한 claim 이 그 문장을 정말 뒷받침하는가. ④ **비교 대상의 공정성** — 우리에게 유리한 baseline 만 고르지 않았는가(이것이 발신 후 가장 아프게 돌아온다). 끝에 VERDICT: PASS|FAIL."
  - id: 8
    name: Tone Review
    profile: reviewer          # ≠ fact-checker
    verifier: true
    upstream: [7]
    gate:
      objective: [outreach_tone, secret_redaction]
      llm: reviewer_verdict
      draft: "reports/<MID>/_private/channels"
    body: "발신물의 **톤과 안전**을 검토한다(객관 게이트: 과장 임계·금지 표현·이모지/해시태그·비밀값). 사람이 읽어야 할 것: ① **전체 인상** — 게이트는 낱말을 세지만, 과장은 문장 구조로도 만들어진다(단정형 반복·수사의문). ② **청중 적합성**(SCOPE 의 대상 독자에게 맞는 문체인가). ③ **경쟁 연구에 대한 예의** — 비교는 하되 깎아내리지 않는가. 학계에서 이것은 오래 남는다. ④ **한계의 언급** — 발신물에 한계가 한 줄도 없으면 그 자체가 과장이다. ⑤ 예제 코드·URL 에 토큰이나 내부 경로가 남아 있지 않은가(게이트가 패턴만 본다). 끝에 VERDICT: PASS|FAIL."
  - id: 9
    name: Launch Prep
    profile: writer
    upstream: [8]              # 게이트: 8 PASS 시 unblock
    body: "발신 체크리스트 `_private/launch-checklist.md` 를 만든다 — **시간 순**으로 무엇을 어디에 올리는지(T-0 릴리스/DOI 확정 · T+0 X 스레드 · T+1일 블로그 · T+2일 README PR) · 각 항목의 **담당(사람)**과 사전 확인 사항 · 발신 후 모니터링(질문 대응·정정 절차). **SCOPE.md 의 `launch_date` 를 본문에 명시하라**(게이트가 대조한다). ⚠️ **고지를 반드시 넣어라**: 이 파이프라인은 **게시하지 않는다** — 사람이 최종 확인 후 직접 올린다. ⚠️ **정정 절차를 적어라** — 발신 후 오류가 발견됐을 때 무엇을 어떻게 고칠지 미리 정해 두는 것이 발신물의 신뢰를 지킨다."
  - id: 10
    name: Release Verify
    profile: fact-checker      # ≠ writer
    verifier: true
    upstream: [9]
    gate:
      objective: [release_readiness]
      llm: fact_checker_verdict
      draft: "reports/<MID>"
    body: "**지금 이것을 공개해도 되는지**를 마지막으로 확인한다(객관 게이트: 공개 근거·특허 상태·엠바고↔발신일·플레이스홀더·그림 권리·고지). 사람이 읽어야 할 것: ① **공개 근거의 실체** — `release_ref` 가 실제로 접근 가능한 것인가(arXiv id 가 맞는가·릴리스 태그가 존재하는가). ② **공동 저자·기관의 동의** — 발신은 개인의 행위가 아니다. ③ **미공개 정보의 혼입** — 채널 본문에 원자료에는 있지만 아직 공개되지 않은 수치·이름·일정이 섞이지 않았는가. ④ **링크 실체** — 아직 만들어지지 않은 릴리스 페이지를 가리키고 있지 않은가(발신일 기준으로 존재해야 한다). 끝에 VERDICT: PASS|FAIL."
  - id: 11
    name: Wiki Update
    profile: curator
    upstream: [10]            # 게이트: 10 PASS 시 unblock
    body: "이 미션에서 얻은 것을 llm-wiki 에 반영한다 — 채널별 규격과 반응이 좋았던 구조 · 분야별 발신 관행(학회 해시태그·발신 시점) · **과장 없이 흥미롭게 쓰는 표현 패턴**(이 아키타입의 가장 재사용 가능한 자산이다) · 공개 근거 판단 사례. entities/concepts + reflection + 재사용률 갱신."
  - id: 12
    name: Deliver
    profile: default          # Solomon
    sam_gate: true
    approval_artifact: "reports/<MID>/_private/launch-checklist.md"
    upstream: [11]
    body: "① 번들을 `_private/outreach-bundle/` 에 조립한다: 채널별 산출물 · `visuals.md` · `cite-pack.md` · `launch-checklist.md`. ② `report/summary.md` 를 쓴다: 어떤 원자료로 어떤 채널을 만들었는지 · **공개 근거와 발신일** · 게이트 5종 판정 · 번들 위치 · **남은 사람 작업**(최종 확인 → 실제 게시 → 반응 모니터링). ③ 커밋 + git push(컨테이너 GITHUB_TOKEN 자격) + Slack 요약. ⚠️ **`publication_policy.mode` 를 Sam 과 확인하라** — 기본은 `local_only` 다. 원자료가 이미 공개된 경우(arXiv·DOI·릴리스)에만 `repo_commit` 으로 바꿀 수 있고, 그때도 **커밋 자체가 공개**임을 분명히 말하라. ⚠️ **우리는 게시하지 않는다.** Slack 요약에 '사람이 최종 확인 후 직접 게시' 를 명시하라. ④ Slack 게시는 반드시 `hermes send --to slack:#mission-log \"<요약+커밋링크>\"`(Web API)로 하라 — 에이전트 slack 도구는 인바운드 Socket Mode 어댑터에 의존해 실패할 수 있다(현재 flapping)."
