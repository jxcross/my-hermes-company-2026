# 아키타입 B — 학술 논문 초고 (11단계)
# 출처: other_projects/harness-templates/research-harnesses/project_paperforge
#       (.claude/skills/paperforge/SKILL.md 8단계 + agents 12종). 변환 절차: docs/13
#
# 변환 판단(요약 — 상세·근거는 docs/13 §2·§5):
#  - paperforge 의 병렬 워커(gather 3종 · read-extract N · draft-section N)는 profile 이 아니라
#    같은 계약의 샤드다 → stage 1개 + `parallel` 블록으로 흡수(신규 profile 0개).
#  - stage 7 의 3비평가(logic/fact/style)는 축이 다르므로 우리 두 검증 지점으로 재배치:
#    사실·인용·최신성 → 6 Cross-Verify(fact-checker) · 논리·문체 → 9 Independent Review(reviewer).
#  - 원본의 "outline 승인 대기"(SKILL.md Stage 5 이후)를 stage 7 sam_gate 로 보존.
#  - 원본에 없던 Dedup(4)·Wiki(10)·Sam 게이트(1·11)는 우리 불변식이라 보강.
#  - `bib_export.py`(BibTeX 산출)는 게이트가 아니라 산출 도구 — 미이식(docs/13 §7).
#
# 스키마 규약은 templates/trend-report.yaml 머리말 참조.

name: academic-paper
category: research
display_name: 학술 논문 초고
maturity: draft            # draft → (실미션 1회 완주) tested → (2회) proven. docs/12 §6
keywords: [논문, 학술, 초고, 저널, 투고, 연구논문, paper, manuscript]
goal_kr: 지정 주제의 학술 논문 초고를 출처 검증된 Markdown 원고로 산출한다(목차 합의 후 집필).
invariants: [scoping_gate, deliver_gate, writer_ne_reviewer, factchecker_ne_reader, revision_loop, sources_cited]

policy:
  recency_policy:
    # 논문은 동향보고서보다 시간축이 넓다 — 고전·seminal 인용이 정상이다.
    cutoff_year_offset: -3       # 현재년 기준. cutoff_year = now + offset (>= 이면 recent)
    recent_ratio: 0.5            # 인용 중 recent 비율 하한(동향보고서 0.6보다 완화)
    hard_block_year_offset: -15  # 이 미만은 seminal 태그 없으면 금지
    seminal_exceptions: true
  source_balance_policy:
    # 논문용 taxonomy. 수집 워커(stage 3)가 이 카테고리로 분할·태깅한다.
    categories: [peer_reviewed, preprint, survey, dataset_code, standards, web]
    min_per_category:
      peer_reviewed: 6   # 학술지·학회 정식 게재
      preprint: 2        # arXiv 등
      survey: 1          # 리뷰·서베이 논문(배경 서술의 근거)
      dataset_code: 0    # 데이터셋·코드 산출물(선택)
      standards: 0       # 표준·기술문서(선택)
      web: 0             # 그 외 웹(선택)
    hard_block_if_missing: false

  analysis_substance_policy:
    # ⚠️ 이 게이트는 M-2026-005 가 뚫고 지나간 자리에 세운 것이다(docs/11 §7 ⑧).
    #    stage 5 샤드 11편 중 8편이 원문을 읽지 않고 작성됐는데, 이 stage 의 객관 게이트
    #    2종(recency_check·source_balance)은 raw/sources.yaml 메타데이터만 읽어 산출물을
    #    아예 열지 않았다. **검사 대상이 아닌 파일을 보는 게이트는 게이트가 아니다.**
    shard_dir: analysis
    exclude: ["_index.md"]
    min_words: 150
    max_words: 20000            # 하한만 두면 폭주를 못 잡는다 — 상한과 짝으로
    min_evidence_bullets: 3
    # ★ 가장 잘 드는 검사. 이 템플릿 stage 5 는 "페이지/섹션까지 특정"을 요구한다.
    #   M-2026-005 실측: 실물 3편 11·71·55 · 날조 8편 전부 0 (겹치는 구간 없음).
    min_locator_citations: 2
    require_shard_per_selected: true

stages:
  - id: 1
    name: Scoping
    profile: default          # Solomon
    sam_gate: true
    upstream: []
    body: "논문 스펙(연구질문·기여·범위·완료조건·목표 인용 수 N) + recency/source_balance 정책을 reports/<MID>/SCOPE.md에 작성. ⚠️ 파이프라인 카드는 이미 생성돼 있다 — 하위 task를 새로 만들거나 kanban decompose 하지 마라(중복 방지). 오직 SCOPE.md 산출과 이 task 완료만."
  - id: 2
    name: Search Strategy
    profile: scout
    upstream: [1]
    body: "연구질문을 하위주제로 분해하고 검색식·대상 DB(arXiv·Semantic Scholar·학회 proceedings)·기간·source_type 분배를 설계."
  - id: 3
    name: Collection
    profile: scout
    upstream: [2]
    parallel:
      mode: workers
      # ⚠️ 워커는 '검색 전략'이 아니라 '산출 taxonomy'로 나눈다 — 그래야 source_balance 게이트가
      #    워커 산출을 그대로 검사할 수 있다. paperforge 의 gather-recent(최신성 가중 검색)는
      #    워커가 아니라 recency_policy 로 흡수했다(전 워커가 함께 지킨다). docs/13 §5.
      workers: [peer_reviewed, preprint, survey, dataset_code, standards]
      batch_size: 3          # 5워커 = 3 + 2, 2라운드
      shard: "raw/sources.<worker>.yaml"
      merge_to: "raw/sources.yaml"
    body: "source_type별 원자료 수집. 각 항목 id(bibkey: lastname<year>)·title·authors·published_year·venue·doi/url·source_type·collected_at·status 기록. published_year 없는 항목은 폐기."
  - id: 4
    name: Dedup·Relevance
    profile: curator
    upstream: [3]
    body: "중복 제거(doi/제목 정규화)·연구질문 대비 관련성 선별. status=selected/rejected 판정과 사유 기록."
  - id: 5
    name: Deep Analysis
    profile: reader
    upstream: [4]
    parallel:
      mode: per_item
      over: "raw/sources.yaml 의 status=selected 자료 각각"
      batch_size: 3
      shard: "analysis/<id>.md"
      merge_to: "analysis/_index.md"
    body: "자료별 구조화 노트: 연구질문·방법·데이터·핵심 주장·근거·한계·우리 연구질문과의 관련. 인용 가능한 문장은 페이지/섹션까지 특정."
  - id: 6
    name: Cross-Verify
    profile: fact-checker      # ≠ reader
    verifier: true
    upstream: [5]
    gate:
      objective: [recency_check, source_balance, analysis_substance]
      llm: fact_checker_verdict
      draft: null              # draft 미생성 단계 — sources·notes 기준 검사
    body: "노트의 주장이 원자료에 실제로 있는지, 인용이 실재 항목을 가리키는지 교차검증(paperforge fact-check 계승). 상충·미검증을 분리 보고. 끝에 VERDICT: PASS|FAIL."
  - id: 7
    name: Synthesis
    profile: synthesizer
    upstream: [6]              # 게이트: 6 PASS 시 게이트키퍼가 unblock
    body: "thesis(주장) + 섹션 목차 + 섹션별 claim→근거 매핑 + 용어집(glossary) + 문체 계약을 outline.md에 작성. 이 목차는 다음 단계에서 Sam 승인 대상이다."
  - id: 8
    name: Draft Sections
    profile: writer
    # 원본(SKILL.md Stage 5 이후 'wait for explicit approval') 보존 = 목차 확정 후 집필 개시 승인.
    # ⚠️ Sam 게이트를 stage 7 에 걸면 안 된다 — 7 은 검증자(6) downstream 이라 두 게이트가 한 카드에
    #    겹치고, 번역기는 카드당 block 을 하나만 걸어 sam_gate 가 검증 게이트를 덮어쓴다(= 6 이 FAIL
    #    이어도 Sam 승인만으로 진행되는 불변식 우회). 그래서 승인을 8 로 내렸다. docs/13 §5.
    sam_gate: true
    approval_artifact: "reports/<MID>/outline.md"   # 승인요청에 목차를 실어 보낸다(gate_summary)
    upstream: [7]
    parallel:
      mode: per_item
      over: "outline.md 의 sections 목록 각각(Abstract·Introduction·Related Work·Method/Analysis·Discussion·Conclusion 등 목차가 정한 것)"
      batch_size: 3
      shard: "draft.<section>.md"
      merge_to: "draft.md"
    body: "섹션별 집필. outline 의 claim→근거 매핑과 용어집을 따르고, 모든 주장에 인용(bibkey)을 단다. 병합 시 outline 순서를 지킨다."
  - id: 9
    name: Independent Review
    profile: reviewer          # ≠ writer
    verifier: true
    upstream: [8]
    gate:
      objective: [recency_check, source_balance]
      llm: reviewer_verdict
      draft: "reports/<MID>/draft.md"
    body: "논리·문체 독립 검토(paperforge logic-critic + style-edit 통합): 논증 구조·주장근거 정합·내부 모순·섹션 간 문체 드리프트·용어 일관성. 완료조건 대비 판정. 끝에 VERDICT: PASS|FAIL."
  - id: 10
    name: Wiki Update
    profile: curator
    upstream: [9]             # 게이트: 9 PASS 시 unblock
    body: "raw→llm-wiki 반영(entities/concepts) + reflection + 재사용률 갱신."
  - id: 11
    name: Deliver
    profile: default          # Solomon
    sam_gate: true
    upstream: [10]
    body: "① BibTeX 생성: `python3 /work/company/scripts/tools/bib_export.py --sources reports/<MID>/raw/sources.yaml --draft reports/<MID>/draft.md --out reports/<MID>/references.bib` (인용된 항목만 내보낸다). ② 원고 커밋 + git push(컨테이너 GITHUB_TOKEN 자격으로 origin) + 미션 로그 요약. ⚠️ 게시는 반드시 아래 CLI 로 하라 — 에이전트의 slack/discord 도구는 인바운드 어댑터에 의존해 실패할 수 있다. <NOTIFY_CMDS>"
