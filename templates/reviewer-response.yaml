# 아키타입 R — 리뷰어 응답서(리비전) 12단계
# 출처: other_projects/harness-templates/research-harnesses/project_rebuttalforge
#       (.claude/skills/rebuttalforge/SKILL.md 8-stage + agents 11종). 변환 절차: docs/13
#
# 이 아키타입이 만드는 것: **재제출 가능한 리뷰어 응답 번들**이다. 원고와 리뷰어 보고서를
# 받아 코멘트를 id 로 분해하고, 코멘트마다 응답(수용/부분수용/반박/설명)을 병렬로 쓰고,
# 수용한 것을 원고에 실제로 반영하고, 커버레터를 붙여 번들로 낸다. 아키타입 B
# (academic-paper)의 다음 단계이고, 리뷰어가 추가 실험을 요구하면 M·P 로 갔다가 돌아온다.
#
# ⚠️ **리뷰어 보고서와 심사 중 원고는 대외비다.** 이 저장소는 PUBLIC 이고 Deliver 가
#    `reports/<MID>/` 를 push 한다. 리뷰어 코멘트를 공개하는 것은 **저널의 비밀유지 관행을
#    깨는 일**이고 심사 중 원고는 미발표 저작물이다. 그래서 `publication_policy.mode` 가
#    **기본 `local_only`** 다 — 원고·리뷰·응답·번들은 `_private/` 에만 두고 커밋되는 것은
#    `report/summary.md` 뿐이다. 아키타입 Q 에서 연 `legal_safety` 의 공개 범위 축을 그대로 쓴다.
#
# 변환 판단(요약 — 상세·근거는 docs/13 §2·§5):
#  - **원본 게이트 2종은 지금까지 이식한 것 중 가장 잘 만들어져 있었다** — 양방향 검사
#    (orphan·duplicate·역방향 대조)를 이미 하고 있었고 verdict 누락도 FAIL 이었다.
#    그런데도 **결함 6건이 나왔다**(전부 실측):
#      · 프론트매터만 있는 **빈 응답 파일 2건에 커버리지 PASS**(파일의 존재를 답변으로 셌다)
#      · ```comments``` 블록이 비면 `expected comments: 0 · PASS`(공집합 아홉 번째)
#      · **커버리지의 분모를 파이프라인 자신이 만든다** — 인자 목록에 리뷰어 원문이 없다.
#        8건 중 5건만 파싱하면 커버리지 100% 다 → `comment_fidelity` 신설(원문 대조)
#      · **원고를 한 글자도 고치지 않고 태그만 붙여도 PASS** — `--original` 인자가 없다
#      · 변경기록을 **마크다운 목록**(`- R1.1: …`)으로 쓰면 0건으로 읽어 **정상 산출물을 반려**
#      · CLAUDE.md 가 문서화한 태그 형식 `[CHANGE-r1: …]` 을 따르면 게이트가 막는다
#        (문서와 코드가 서로 다른 형식을 말한다)
#  - **크리틱 2종(tone-polish·argument-strength)은 스크립트가 없다.** 그런데 규칙은 이미
#    기계적으로 쓰여 있었다("근거 없는 반박 = HIGH", "금지 표현 = HIGH, no exceptions")
#    → `response_quality` 신설.
#  - **재사용**: `legal_safety`(고지 + 개인정보 + **공개 범위**). `sources_cited` 는 선언하지
#    않는다 — 근거가 웹 출처가 아니라 **원고와 리뷰어 원문**이다(code-docs·code-migration 과 같다).
#  - `diff_export.py`·`bundle_export.py`·`comments_state.py` 는 미이식(산출 도구 · Kanban).
#
# 스키마 규약은 templates/trend-report.yaml 머리말 참조.

name: reviewer-response
category: research
display_name: 리뷰어 응답서(코멘트 전건 대응 + 원고 반영)
maturity: draft
goal_kr: 리뷰어 보고서의 모든 코멘트에 근거 있는 응답을 달고 수용한 지적을 원고에 실제로 반영해 재제출 가능한 리비전 번들을 낸다.
requires_profiles: []
invariants: [scoping_gate, deliver_gate, writer_ne_reviewer, factchecker_ne_reader, revision_loop]

policy:
  # ── 공개 범위 — 리뷰어 코멘트와 심사 중 원고는 대외비다 ──────────────────────
  publication_policy:
    mode: local_only
    private_dir: _private
    content_files:
      - reviews
      - comments.md
      - responses
      - original-ms.md
      - revised-ms.md
      - cover-letter.md
      # ⚠️ `bundle` 은 넣지 않는다 — Deliver(stage 12)에서 조립되는데 이 검사는
      #    Final Review(stage 10)에서 돈다. 아직 없는 산출물의 위치를 강제하면
      #    정상 미션이 반려된다(픽스처가 잡았다).

  # ── 신설: 파싱 충실도(원본에 이 검사가 통째로 없다) ─────────────────────────
  fidelity_policy:
    reviews_dir: _private/reviews
    comments_file: _private/comments.md
    min_comments: 1
    # 리뷰어 원문 중 코멘트로 포착된 비율. 보고서에는 총평·요약도 있으므로 100%가 아니다.
    # ⚠️ 처음 0.4 로 뒀더니 **5건 중 1건을 빠뜨려도 72%라 통과**했다(픽스처가 잡았다).
    #    짧은 지적은 비율을 거의 움직이지 않는다 — 그래서 게이트가 **번호 매긴 항목 수**를
    #    함께 센다(구조가 있는 곳에서는 구조를 쓴다). 비율은 번호 없는 산문형 리뷰의 보루다.
    min_coverage_ratio: 0.75
    require_declared_count: true

  # ── 이식한 Gate 1(커버리지) — 결함 2건 수정 ─────────────────────────────────
  coverage_policy:
    comments_file: _private/comments.md
    responses_dir: _private/responses
    min_comments: 1
    min_response_words: 30      # ⚠️ 원본은 빈 파일에도 커버리지 PASS 를 줬다
    require_declared_count: true

  # ── 이식한 Gate 2(변경 정합) — 결함 3건 수정 + 원본 대조 신설 ───────────────
  change_policy:
    responses_dir: _private/responses
    revised_file: _private/revised-ms.md
    change_log: _private/change-log.md
    original_file: _private/original-ms.md
    verdicts_change: [accept, partially-accept]
    verdicts_nochange: [rebut, clarification-only]
    require_original_diff: true   # ⚠️ 태그만 붙이고 원고를 안 고치는 것을 막는다

  # ── 신설: 원본 크리틱 2종을 코드로 ──────────────────────────────────────────
  response_policy:
    responses_dir: _private/responses
    cover_letter: _private/cover-letter.md
    min_response_words: 30
    # ⚠️ 목록은 **정책 소유**다. 넓히면 정상 문서를 반려한다(legalforge 교훈) — 기본값은
    #    리뷰어를 향한 표현으로 좁혔다. 저널·언어 문화에 맞게 미션마다 조정하라.
    banned_phrases:
      - 리뷰어가 오해
      - 리뷰어는 오해
      - 리뷰어의 오해
      - 리뷰어가 틀렸
      - 리뷰어는 틀렸
      - 잘못 이해하
      - 이미 서술했
      - 이미 기술했
      - the reviewer misunderstood
      - the reviewer is incorrect
      - as we already wrote
      - obviously
    evidence_verdicts: [rebut]
    pointer_verdicts: [accept, partially-accept]
    divergence_verdicts: [partially-accept]
    min_sentences:
      clarification-only: 3
    # ⚠️ 원본은 250~500 **영문 word** 다. 우리 본문은 국문이고 이 프로젝트의 기준 환산은
    #    **국문 A4 1쪽 ≈ 500~700 어절**(policy-brief 에서 재보정한 값). 커버레터는 1쪽 안팎이
    #    적정이므로 어절 기준으로 다시 잡는다 — 영문 수치를 그대로 쓰면 잘 쓴 국문 커버레터가
    #    분량 초과로 반려된다(정상 픽스처가 619 어절로 걸렸다).
    cover_letter_words: [300, 700]

  # ── 재사용: 고지 + 개인정보 + 공개 범위(아키타입 Q 에서 연 축) ──────────────
  legal_safety_policy:
    require_disclaimer: true
    disclaimer_reason: "리비전 산출물은 저자 본인의 검토와 제출을 전제로 한 초안이다"
    disclaimer_terms:
      - "저자 검토 후 제출"
      - "리뷰어 코멘트는 대외비"
      - "실제 제출은 저자"
    disclaimer_files: [summary.md]
    block_pii: true
    allow_placeholder: true

stages:
  - id: 1
    name: Scoping
    profile: default          # Solomon
    sam_gate: true
    upstream: []
    body: "미션 스펙을 reports/<MID>/SCOPE.md 에 작성한다 — 대상 원고 · 저널/학회와 원고번호 · 마감일 · 리뷰어 수 · 응답 톤(격식/간결) · 완료조건. 그리고 **입력 자료를 `_private/` 에 배치하라**: 원고는 `_private/original-ms.md`, 리뷰어 보고서는 `_private/reviews/<reviewer>.md`(리뷰어별 한 파일). ⚠️ **공개 범위를 Sam 에게 분명히 알려라**: 리뷰어 코멘트는 **저널의 비밀유지 관행상 대외비**이고 심사 중 원고는 미발표 저작물이다. 기본값 `local_only` 에서 원고·리뷰·응답·번들은 `_private/`(커밋되지 않음)에만 남고 저장소에는 요약만 올라간다. ⚠️ **원본 원고를 반드시 그대로 보존하라** — 게이트가 수정 원고를 원본과 대조한다(원본이 없으면 '바꿨다'는 주장을 태그 문자열로만 확인하게 된다). ⚠️ 파이프라인 카드는 이미 생성돼 있다 — 하위 task를 새로 만들거나 kanban decompose 하지 마라."
  - id: 2
    name: Parse Reviews
    profile: reader
    upstream: [1]
    body: "리뷰어 보고서를 코멘트 단위로 분해해 `_private/comments.md` 에 정리한다. **형식을 정확히 지켜라**(게이트가 원문과 대조한다):\n```\nn_comments: 6\nreviewers: [R1, R2]\n```\n```comments\n- id: R1.1\n  category: \n- id: R1.2\n  category: \n```\n그리고 코멘트마다 **원문을 그대로 옮긴 절**을 둔다:\n`## R1.1`\n(리뷰어가 쓴 문장 그대로)\n\n⚠️ **인용은 verbatim 이어야 한다** — 요약하거나 고쳐 쓰면 게이트가 '원문에 없는 말'로 반려한다. 목록 기호를 떼는 것은 괜찮다(게이트가 양쪽에서 똑같이 뗀다). ⚠️ **id 는 여기서 확정되고 절대 바뀌지 않는다**(`R<리뷰어>.<순번>`) — 응답·변경기록·커버레터가 전부 이 키를 참조한다. ⚠️ **빠뜨리지 마라.** 게이트가 리뷰어 원문의 **포착률**을 잰다 — 지적을 코멘트 목록에 넣지 않으면 답하지 않은 채 재제출된다. 총평·인사말은 코멘트가 아니지만, **판단이 애매하면 코멘트로 만들어라**(답해서 손해 볼 것은 없다)."
  - id: 3
    name: Comment Verify
    profile: fact-checker      # ≠ reader
    verifier: true
    upstream: [2]
    gate:
      objective: [comment_fidelity]
      llm: fact_checker_verdict
      draft: "reports/<MID>"
    body: "**파싱이 원문에 충실한지** 검증한다(객관 게이트가 verbatim 실재·포착률·리뷰어 부재를 대조한다). ⚠️ **이 검증이 맨 앞에 있는 이유**: 코멘트 목록은 뒤의 모든 커버리지 검사의 **분모**다. 여기서 빠진 지적은 파이프라인 어디에서도 드러나지 않는다(원본 게이트는 이 자리를 아예 보지 않아 8건 중 5건만 파싱해도 커버리지 100% 였다). 사람이 읽어야 할 것: ① **하나의 코멘트에 여러 요구가 섞여 있지 않은가** — 실험 추가와 표현 수정이 한 id 에 묶이면 하나만 답하고 통과할 수 있다. ② **쪼갠 것이 맥락을 잃지 않았는가**(앞 문장의 조건절이 떨어져 나가면 의미가 뒤집힌다). ③ **편집자 코멘트**(리뷰어가 아닌 editor 의 요구)가 누락되지 않았는가. ④ 리뷰어의 어조가 강한 지적을 순화해 옮기지 않았는가(원문이 강하면 강한 대로 둬야 응답의 무게가 맞는다). 끝에 VERDICT: PASS|FAIL."
  - id: 4
    name: Categorize·Dedup
    profile: curator
    upstream: [3]              # 게이트: 3 PASS 시 게이트키퍼가 unblock
    body: "코멘트를 분류하고 정리해 `_private/categorized.md` 에 쓰고, `comments.md` 의 `category:` 필드를 **제자리에서** 채운다(파일을 다시 쓰지 마라 — id 가 흔들린다). ① 분류: `major`(추가 실험·핵심 주장 변경) · `minor`(표현·표기) · `clarification`(질문) · `factual`(사실 오류 지적) · `methodological`(방법론 이의). ② **리뷰어 간 중복 지적을 상호 연결**하라(`duplicates: [R2.3]`) — 같은 지적에 서로 다른 답을 하면 심사자가 바로 알아챈다. ③ **대응 순서와 난이도**를 정리하고, ④ 코멘트마다 **제안 입장**(수용/부분수용/반박/설명)과 근거를 한 줄로 적어라 — Sam 이 다음 단계에서 이것을 승인한다. ⚠️ 반박을 제안할 때는 **근거가 실제로 있는지** 먼저 확인하라(근거 없는 반박은 게이트가 반려한다)."
  - id: 5
    name: Response Draft
    profile: writer
    sam_gate: true             # 입장(수용/반박)은 저자의 판단이다 — 집필 전에 사람이 정한다
    approval_artifact: "reports/<MID>/_private/categorized.md"
    upstream: [4]
    parallel:
      mode: per_item
      # 코멘트마다 같은 계약(하나의 지적에 답한다) = profile 아님, 워커다.
      items_from: "_private/comments.md"
      batch_size: 3
      shard: "_private/responses/<item>.md"
      merge_to: null           # 응답은 코멘트별 독립 문서다 — 병합 대상이 아니다
    body: "담당 코멘트에 답하는 `_private/responses/<id>.md` 를 쓴다. **프론트매터에 `comment_id` 와 `verdict` 를 반드시 넣어라**(`accept` | `partially-accept` | `rebut` | `clarification-only`). 본문 규칙: ① **리뷰어의 지적을 먼저 인정하는 한 문장**으로 연다. ② 판정별 필수 요소 — **rebut** 은 근거를 인용한다(`3.2절`·`Table 4`·수치·문헌 중 하나. **근거 없는 반박은 게이트가 반려한다**) · **accept**·**partially-accept** 는 원고의 **어디에** 반영됐는지 가리키고 ```changes``` 블록에 액션을 적는다 · **partially-accept** 는 제안과 **어떻게 달라졌는지** 설명한다 · **clarification-only** 는 최소 3문장의 실질 답변을 쓴다('질문 감사합니다' 로 끝내지 마라). ③ 1인칭 복수('저희는'/'we')로 일관되게 쓴다.\n```changes\n- action: replace\n  section: 3.2\n  old_text: 기존 문장\n  new_text: 수정 문장\n```\n⚠️ **금지 표현**: '리뷰어가 오해', '이미 서술했', '리뷰어가 틀렸', 'obviously' 등은 게이트가 반려한다 — 반박은 '말씀하신 …에 대해 저희는 …를 근거로 달리 봅니다' 로 쓴다. ⚠️ **추가 실험이 필요하면 `partially-accept` + `## Open Items` 에 TODO** 로 남겨라(이 파이프라인은 실험을 돌리지 않는다 — 아키타입 M·P 로 간다)."
  - id: 6
    name: Response Verify
    profile: reviewer          # ≠ writer
    verifier: true
    upstream: [5]
    gate:
      objective: [comment_coverage, response_quality]
      llm: reviewer_verdict
      draft: "reports/<MID>"
    body: "**원고를 고치기 전에** 응답을 검증한다(객관 게이트: 전건 응답·실체·판정별 필수 요소·금지 표현). ⚠️ **여기가 재작업 비용의 분기점이다** — 응답의 입장이 틀린 채로 원고를 고치면 원고까지 되돌려야 한다. 사람이 읽어야 할 것: ① **답이 지적에 실제로 답하는가** — 게이트는 근거 표시의 존재만 본다. 인용한 절이 그 주장을 정말 뒷받침하는지는 네가 읽는다. ② **반박의 설득력** — 리뷰어가 그 근거를 이미 알고도 지적한 것은 아닌가. ③ **중복 지적에 일관된 답**을 했는가(R1.2 는 수용인데 같은 내용의 R2.3 은 반박이면 치명적이다). ④ **약속의 과대** — 못 할 실험을 하겠다고 하지 않았는가. ⑤ 어조(게이트는 금지어만 본다 — 문장 전체가 방어적으로 읽히는 경우를 네가 잡는다). 끝에 VERDICT: PASS|FAIL."
  - id: 7
    name: Apply Changes
    profile: writer
    upstream: [6]              # 게이트: 6 PASS 시 unblock
    body: "수용한 지적을 원고에 실제로 반영한다. `_private/original-ms.md` 를 **읽어서** `_private/revised-ms.md` 를 만들고(**원본은 그대로 둬라 — 게이트가 대조한다**), 변경 지점마다 태그를 남긴다: `[CHANGE-R1.1: 3.2절에 검증 실험 추가]`. 그리고 `_private/change-log.md` 에 코멘트 id 순서로 한 줄씩 기록한다:\n`- R1.1: 3.2절에 국내 데이터 검증 실험을 추가했다`\n⚠️ **태그 형식은 `[CHANGE-<id>: 설명]` 하나뿐이다** — 원본은 문서(`[CHANGE-r1: …]`)와 코드(`[CHANGE-R1.1:`)가 서로 다른 형식을 말해 문서를 따르면 게이트가 막혔다. ⚠️ **태그만 붙이고 내용을 고치지 않으면 반려된다** — 게이트가 태그가 붙은 문단을 원본과 대조한다(원본 게이트의 가장 큰 구멍이 이것이었다). ⚠️ **`rebut`·`clarification-only` 로 판정한 코멘트는 원고를 고치지 마라** — 반박한다고 해 놓고 조용히 고치면 게이트가 잡는다. ⚠️ `replace`/`delete` 의 `old_text` 를 원고에서 찾지 못하면 **조용히 넘어가지 말고** `## Open Items` 에 적고 보고하라."
  - id: 8
    name: Change Verify
    profile: fact-checker      # ≠ writer
    verifier: true
    upstream: [7]
    gate:
      objective: [change_consistency]
      llm: fact_checker_verdict
      draft: "reports/<MID>"
    body: "판정 ↔ 변경기록 ↔ 원고가 정합하는지 검증한다(객관 게이트가 양방향 + **원본 대조**를 한다). 사람이 읽어야 할 것: ① **변경이 지적을 실제로 해소하는가** — 게이트는 '달라졌다'까지만 본다. 리뷰어가 원한 것이 그 변경인지는 네가 읽는다. ② **변경이 원고의 다른 부분과 모순되지 않는가**(3.2절을 고쳤는데 초록과 결론이 옛 주장을 그대로 말하고 있지 않은가 — 이것이 리비전에서 가장 흔한 사고다). ③ **수치·표·참고문헌의 연쇄 갱신**(표를 바꿨으면 본문의 인용 수치도 바뀌었는가). ④ **의도하지 않은 변경** — 태그 없는 곳이 바뀌지 않았는가(모든 변경은 코멘트로 소급돼야 한다). 끝에 VERDICT: PASS|FAIL."
  - id: 9
    name: Cover Letter
    profile: writer
    upstream: [8]
    body: "편집자에게 보내는 `_private/cover-letter.md` 를 쓴다(**250~500 어절** — 게이트가 잰다). 구성: ① 저널명·원고번호·제목과 재제출 사실 · ② **무엇이 바뀌었는지 요약**(major/minor 로 묶어 3~6줄. 코멘트 id 를 달아라) · ③ 편집자가 직접 남긴 요구가 있으면 그것에 **한 문장씩 직접** 답한다 · ④ 반박한 지적이 있으면 **그 사실과 이유를 숨기지 말고** 한 줄로 밝힌다(편집자가 응답서에서 처음 발견하는 것보다 낫다) · ⑤ 감사와 맺음. ⚠️ 금지 표현은 여기서도 반려된다 — **편집자가 가장 먼저 읽는 문서다.**"
  - id: 10
    name: Final Review
    profile: reviewer          # ≠ writer
    verifier: true
    upstream: [9]
    gate:
      objective: [legal_safety]
      llm: reviewer_verdict
      draft: "reports/<MID>"
    body: "재제출 직전 최종 검토(객관 게이트: 고지·개인정보·**공개 범위**). 사람이 읽어야 할 것: ① **번들의 완결성** — 응답서·수정 원고·커버레터·변경기록이 서로를 정확히 가리키는가. ② **읽는 순서** — 편집자가 커버레터만 읽고도 무엇이 달라졌는지 아는가. ③ **응답서의 어조가 전체적으로 일관**한가(한 응답만 날이 서 있지 않은가). ④ **깨끗한 사본** — 제출용 원고에서 `[CHANGE-…]` 태그가 제거된 판본이 있는가(태그본은 저자용이다). ⑤ **마감** — SCOPE.md 의 마감일까지 사람이 할 일(최종 확인·업로드)이 남아 있음을 요약에 적었는가. 끝에 VERDICT: PASS|FAIL."
  - id: 11
    name: Wiki Update
    profile: curator
    upstream: [10]            # 게이트: 10 PASS 시 unblock
    body: "이 미션에서 얻은 것을 llm-wiki 에 반영한다 — 저널·학회별 리비전 관행(응답 형식·분량·마감) · 자주 나오는 지적 유형과 **효과가 있었던 응답 패턴** · 반박이 통한 경우와 통하지 않은 경우 · 분야별 심사 관점. entities/concepts + reflection + 재사용률 갱신. ⚠️ **리뷰어 코멘트 원문·원고 내용은 위키에 옮기지 마라** — 대외비다. 일반화된 패턴만 남긴다."
  - id: 12
    name: Deliver
    profile: default          # Solomon
    sam_gate: true
    approval_artifact: "reports/<MID>/report/summary.md"
    upstream: [11]
    body: "① 번들을 `_private/bundle/` 에 조립한다: `response-letter.md`(코멘트 id 순으로 원문 인용 + 응답을 합친 제출용 문서) · `revised-ms.md`(태그 제거한 **깨끗한 사본**) · `revised-ms-tracked.md`(태그본) · `cover-letter.md` · `change-log.md`. ② `report/summary.md` 를 쓴다(**커밋되는 유일한 산출물**): 코멘트 수와 판정 분포(수용/부분수용/반박/설명) · 변경 건수 · **게이트 4종 판정** · 번들 위치 · **남은 사람 작업**(최종 확인·저널 시스템 업로드·마감일) · 고지(리뷰어 코멘트는 대외비 · 저자 검토 후 제출 · 실제 제출은 저자). ⚠️ **요약에 리뷰어 코멘트 원문이나 원고 내용을 옮겨 적지 마라** — 이 파일은 PUBLIC 저장소에 올라간다. ③ 커밋 + git push(컨테이너 GITHUB_TOKEN 자격) + Slack 요약. ⚠️ **`publication_policy.mode` 를 다시 확인하고 Sam 에게 무엇이 커밋되는지 명시하라.** ④ Slack 게시는 반드시 `hermes send --to slack:#mission-log \"<요약+커밋링크>\"`(Web API)로 하라 — 에이전트 slack 도구는 인바운드 Socket Mode 어댑터에 의존해 실패할 수 있다(현재 flapping)."
