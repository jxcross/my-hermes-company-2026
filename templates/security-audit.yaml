# 아키타입 L — 보안 감사(보조) (11단계)
# 출처: other_projects/harness-templates/domain-harnesses/project_secforge
#       (.claude/skills/secforge/SKILL.md 8-stage + agents 13종). 변환 절차: docs/13
#
# ⚠️ **이 파이프라인의 산출물은 정식 보안 감사가 아니다.** 침투 테스트나 자격 있는 보안
#    전문가의 감사를 대체하지 않으며, `secret_redaction` 게이트가 고지 부재를 자동 반려한다.
#    **Report-only** — 이 파이프라인은 취약점을 고치지 않는다(수정은 아키타입 K 또는 사람이).
#
# ⚠️ **공개 범위가 이 아키타입의 핵심 안전 문제다.**
#    이 저장소는 PUBLIC 이고 Deliver 가 `reports/` 를 push 한다. 그런데 이 파이프라인의
#    산출물은 **취약점의 위치와 재현 방법**이다. 그대로 push 하면 **감사 보고서가 곧
#    공격 안내서**가 되고, secrets-scanner 가 찾아낸 키를 그대로 적으면 **감사가 유출 사고**가
#    된다. 그래서 산출물을 둘로 나눈다:
#      · `reports/<MID>/_private/`  — 상세 발견(파일·줄·재현·원문 증거). **gitignore.**
#      · `reports/<MID>/report/`    — 커밋·공유용. 범주별 건수·심각도 분포·조치 계획만.
#                                     비밀값은 마스킹, 익스플로잇 경로는 싣지 않는다.
#    `secret_redaction` 게이트가 커밋 대상만 검사한다(`_private/` 는 제외).
#
# 변환 판단(요약 — 상세·근거는 docs/13 §2·§5):
#  - 원본 게이트 3종이 **전부 fail-open** 이었다(입력이 없거나 깨지면 PASS). 보안 게이트에서
#    "데이터가 없다"는 "문제가 없다"가 아니다 — 전부 fail-closed 로 뒤집었다.
#  - **GATE 1 은 판정 방향을 뒤집어 이식했다.** 원본은 "Critical/High = 0 건"을 요구하는데,
#    report-only 도구에서 이것은 **취약점을 찾을수록 보고서가 막히는** 구조다. 심각한 발견이
#    나왔을 때야말로 보고가 빨리 사람에게 가야 한다. → `finding_completeness` 로 바꿔
#    **"보고가 조치 가능한가"** 를 본다(건수 상한은 정책으로 남겼고 기본은 무제한).
#  - **신규 profile 0개 — 대장의 "예상 있음(스캐너)"은 빗나갔다.** 이 하네스의 스캐너는
#    `Grep`/`Glob` 로 소스를 읽어 패턴을 분류한다 = `reader`(§3 신규 후보 신호인 `Edit`·
#    `playwright` 가 없다). 실제 스캐닝 도구(semgrep·trivy)를 붙인다면 그때는 **실행 결과로
#    판정하는** `tester` 계열이 될 것이다 — §7 에 남겨 뒀다.
#  - stage 3 의 3 스캐너(owasp/cwe/secrets)는 "소스를 훑어 취약 패턴을 찾는다"는 같은 계약이라
#    `parallel: workers`. 코드를 **읽기만** 하므로 git 경합 문제(아키타입 K)가 없다.
#  - `bundle_export.py`·`runs_state.py` 는 미이식.
#
# 스키마 규약은 templates/trend-report.yaml 머리말 참조.

name: security-audit
category: engineering
display_name: 보안 감사(OWASP·CWE·CVE·STRIDE, 보조)
maturity: draft
goal_kr: 소스·의존성·설정을 대상으로 OWASP Top 10·CWE·의존성 CVE·STRIDE 위협모델을 점검하고, 조치 가능한 보안 보고서를 산출한다(정식 감사 아님·수정 없음).
requires_profiles: [architect]
invariants: [scoping_gate, deliver_gate, writer_ne_reviewer, factchecker_ne_reader, revision_loop]
# ⚠️ `sources_cited` 를 선언하지 않는다 — 근거가 웹 출처가 아니라 **코드의 위치(file:line)와
#    CVE 데이터베이스**다. 그 대조는 게이트가 직접 한다(code-docs·code-migration 과 같다).

policy:
  owasp_policy:
    categories: [A01, A02, A03, A04, A05, A06, A07, A08, A09, A10]
    allowed_status: [audited, not_applicable]
    require_evidence: true      # '점검했다'는 주장만으로는 감사가 아니다
    min_evidence_chars: 10

  cve_policy:
    require_remediation_for: [critical, high]
    require_scan_evidence: true # 매니페스트·패키지를 몇 개 대조했는지 밝혀야 한다
    min_remediation_chars: 10

  finding_policy:
    require_fields: [location, evidence, impact, remediation]
    strict_severities: [critical, high]
    min_field_chars: 5
    # ⚠️ 기본은 **무제한**이다. 건수로 막으면 감사가 발견을 벌하게 된다(§5).
    #    릴리스 게이트로 쓰고 싶을 때만 Sam 이 값을 넣는다.
    max_critical: null
    max_high: null

  redaction_policy:
    require_disclaimer: true
    disclaimer_terms: ["정식 보안 감사가 아닙니다", "보안 전문가 검토", "침투 테스트를 대체하지"]
    block_secrets: true

stages:
  - id: 1
    name: Scoping
    profile: default          # Solomon
    sam_gate: true
    upstream: []
    body: "감사 범위를 확정해 reports/<MID>/SCOPE.md 에 작성 — 대상과 **범위 밖** · 감사 유형(OWASP/CWE/CVE/STRIDE 중 선택) · 입력 종류(소스·매니페스트·Dockerfile·환경설정) · 완료조건. ⚠️ **frontmatter 에 `codebase: <경로>` 와 `audit_types: [owasp, cwe, cve, stride]` 를 선언**하라. ⚠️ **안전 규약**: ① 감사 대상은 **우리가 권한을 가진 코드**여야 한다 — 남의 시스템을 스캔하지 마라. ② 이 파이프라인은 **읽기만 한다** — 취약점을 고치거나 익스플로잇을 만들지 않는다(수정은 별도 미션). ③ **산출물을 둘로 나눈다**: 상세 발견은 `reports/<MID>/_private/`(gitignore·커밋 안 됨), 공유용 요약은 `reports/<MID>/report/`. 이 저장소는 PUBLIC 이고 Deliver 가 push 하므로 **위치·재현 정보와 비밀값을 커밋 대상에 넣으면 안 된다.** ⚠️ 파이프라인 카드는 이미 생성돼 있다 — 하위 task를 새로 만들거나 kanban decompose 하지 마라."
  - id: 2
    name: Target Ingest
    profile: reader
    upstream: [1]
    body: "감사 대상을 인벤토리해 target.md 에 정리 — 소스 트리와 언어별 파일 수 · 의존성 매니페스트(package.json·requirements.txt·pom.xml·go.mod 등)와 **패키지 총수** · Dockerfile·컴포즈 · 설정/환경 파일의 **존재와 위치**(값이 아니라 위치) · 외부 노출면(HTTP 라우트·CLI·큐 소비자) · 인증/인가 지점. ⚠️ **환경 파일의 내용을 옮겨 적지 마라** — 존재와 키 이름까지만. 값은 절대 기록하지 않는다. ⚠️ 코드를 고치지 마라."
  - id: 3
    name: Static Scan
    profile: reader
    upstream: [2]
    parallel:
      mode: workers
      # 세 스캐너는 "소스를 훑어 취약 패턴을 찾는다"는 같은 계약 = profile 아님, 워커다.
      # 읽기 전용이라 아키타입 K 의 git 경합 문제가 없다.
      workers: [owasp, cwe, secrets]
      batch_size: 3          # 3워커 = 한 배치
      shard: "_private/scan.<worker>.md"
      merge_to: "_private/static.md"
    body: "자기 축으로 소스를 훑는다 — **owasp**=OWASP Top 10(2021) 범주별 점검(A01 접근통제 · A02 암호 · A03 인젝션 · A04 설계 · A05 설정 · A06 취약 구성요소 · A07 인증 · A08 무결성 · A09 로깅 · A10 SSRF)하고 **범주마다 `status`(audited/not_applicable)와 근거를 남긴다**(게이트가 10개 전부를 요구한다) · **cwe**=CWE Top 25 패턴(SQL 인젝션·XSS·경로 순회·명령 주입·CSRF·역직렬화 등) · **secrets**=하드코딩된 키·토큰·개인키·비밀번호.\n각 발견은 **id·title·severity·category·location(`file:line`)·evidence·impact·remediation** 을 갖춘다. ⚠️ **비밀값을 발견하면 값을 적지 마라** — 위치와 종류, 마스킹 형태(`AKIA****`)만. ⚠️ 산출은 `_private/` 아래에 둔다(커밋되지 않는다). ⚠️ 패턴이 맞았다고 곧 취약점이 아니다 — **왜 취약한지**를 근거에 쓰고, 확신이 없으면 severity 를 낮추고 그 사실을 밝혀라(오탐 남발은 보고서를 무력하게 만든다)."
  - id: 4
    name: Dependency CVE
    profile: scout
    upstream: [3]
    body: "의존성 매니페스트의 패키지를 공개 취약점 데이터베이스(NVD·OSV·GitHub Advisory)와 대조해 `_private/cve.md` 에 기록한다. **형식을 정확히 지켜라**(게이트가 파싱한다):\n`scanned_manifests: 2` · `scanned_packages: 137` 줄을 먼저 적고,\n```cves\n- cve_id: CVE-2024-12345\n  package: requests\n  installed: 2.25.1\n  severity: high\n  fixed_in: 2.32.0\n  remediation: 2.32.0 이상으로 올린다(호환성 영향 없음)\n```\n⚠️ **severity 를 비우지 마라** — 원본은 등급이 비면 고위험 목록에서 빠져 조치 요구가 사라졌다(게이트가 이제 반려한다). ⚠️ **대조한 매니페스트·패키지 수를 반드시 적어라** — 스캔 증거 없이 'CVE 0건'은 받아들여지지 않는다. ⚠️ 실제로 설치된 버전(lock 파일)을 기준으로 판단하라."
  - id: 5
    name: STRIDE Model
    profile: architect
    upstream: [4]
    body: "시스템 아키텍처 수준에서 STRIDE 위협 모델을 `_private/stride.md` 에 작성한다 — 신뢰 경계와 데이터 흐름을 먼저 그리고(mermaid), 경계마다 **S**poofing · **T**ampering · **R**epudiation · **I**nformation disclosure · **D**enial of service · **E**levation of privilege 를 검토한다. 위협마다 완화책의 **현재 상태**(있음/부분/없음)와 근거를 적는다. ⚠️ 정적 스캔이 못 보는 것을 노려라 — 설계 수준의 결함(권한 모델의 구멍·감사 로그 부재·신뢰 경계 오설정)은 패턴 매칭으로 나오지 않는다. ⚠️ 추측한 아키텍처가 아니라 **코드에서 확인한** 구성으로 그려라."
  - id: 6
    name: Severity Classify
    profile: synthesizer
    upstream: [5]
    body: "정적 스캔·CVE·STRIDE 발견을 통합해 `_private/findings.md` 에 정리한다. 중복을 병합하고(같은 결함이 세 축에서 잡히는 일이 흔하다) CVSS 관점(공격 경로·복잡도·필요 권한·영향)으로 등급을 확정한다. **다음 형식을 정확히 지켜라**(게이트가 파싱한다):\n`n_critical: 0` · `n_high: 1` 줄을 먼저 적고, ```findings``` 블록(항목마다 id·title·severity·category·location·evidence·impact·remediation)과 ```owasp``` 블록(범주 10개 전부 status·근거)과 ```cves``` 블록을 담는다.\n⚠️ **요약 수치와 목록이 일치해야 한다** — 원본은 자기 신고 숫자만 봐서 목록에 Critical 5건을 적고 `n_critical: 0` 이라 써도 통과했다. ⚠️ 등급을 부풀리지도 낮추지도 마라 — 근거로 정당화하라. ⚠️ **취약점을 많이 찾았다고 이 파이프라인이 실패하는 것이 아니다**(원본의 '0건' 게이트는 제거했다). 정확한 보고가 목적이다."
  - id: 7
    name: Finding Verify
    profile: fact-checker      # ≠ synthesizer
    verifier: true
    upstream: [6]
    gate:
      objective: [finding_completeness, owasp_coverage, cve_remediation]
      llm: fact_checker_verdict
      draft: "reports/<MID>/_private/findings.md"
    body: "발견이 **사실인지** 검증한다(객관 게이트는 형식과 수치만 본다): ① **오탐 판별** — `location` 을 열어 실제로 그 줄이 그 취약점인지 확인하라. 정적 패턴이 맞았지만 상위에서 검증되고 있어 실제로는 안전한 경우가 흔하다(그러면 등급을 낮추거나 제거하고 사유를 남긴다). ② **누락 판별** — 감사 유형에 선언된 축이 실제로 돌았는가, `not_applicable` 로 처리한 OWASP 범주의 사유가 타당한가(대상에 웹 계층이 없어 A01 이 무의미한 것과, 귀찮아서 건너뛴 것은 다르다). ③ **CVE 의 실재** — 인용한 CVE 번호가 실제로 그 패키지·그 버전 범위에 해당하는가, 이미 패치된 버전을 쓰고 있지 않은가. ④ **비밀값 노출** — `_private/` 밖으로 값이 새지 않았는가. ⑤ 등급이 영향에 비해 정당한가. 끝에 VERDICT: PASS|FAIL."
  - id: 8
    name: Report Write
    profile: writer
    upstream: [7]              # 게이트: 7 PASS 시 게이트키퍼가 unblock
    body: "**공유용** 보고서를 `reports/<MID>/report/` 에 쓴다(이것이 커밋된다). ① `security-report.md` — 요약(감사 범위·기간·방법) · **심각도 분포와 범주별 건수** · 주요 위험의 성격(위치·재현 없이 '무엇이 왜 위험한가') · 우선순위 조치 계획과 기한 · 잔여 위험. ② `owasp-checklist.md` — 범주 10개의 점검 상태와 근거 요약. ③ `remediation-guide.md` — 조치 방법(일반론 수준: '파라미터 바인딩으로 교체' 는 되고 '이 줄을 이렇게 고치면 우회된다' 는 안 된다). ④ `usage-disclaimer.md` — **필수 고지**('본 보고서는 정식 보안 감사가 아닙니다. 침투 테스트를 대체하지 않으며 자격 있는 보안 전문가의 검토를 권장합니다.').\n⚠️ **이 문서들은 PUBLIC 저장소에 push 될 수 있다.** 파일:줄 위치·재현 절차·익스플로잇 경로·비밀값을 **넣지 마라**. 상세가 필요한 사람은 `_private/` 를 본다. ⚠️ 비밀값을 언급해야 하면 마스킹(`AKIA****`)한다 — 게이트가 실제 값을 반려한다."
  - id: 9
    name: Report Review
    profile: reviewer          # ≠ writer
    verifier: true
    upstream: [8]
    gate:
      objective: [secret_redaction]
      llm: reviewer_verdict
      draft: "reports/<MID>/report"
    body: "공개 안전성과 유용성을 독립 검토한다: ① **공개 안전성**(게이트는 알려진 비밀 패턴만 잡는다 — **재현 가능한 수준의 상세**가 남아 있지 않은지 네가 읽는다. '인증 우회 가능'은 되고 '이 파라미터에 이 값을 넣으면 우회된다'는 안 된다). ② **조치 가능성** — 개발자가 이 보고서만 보고 무엇을 할지 알 수 있는가(상세는 `_private/` 에 있다는 안내가 있는가). ③ **우선순위의 타당성** — 심각도와 조치 순서가 어긋나지 않는가. ④ **고지 문구**의 존재와 위치. ⑤ 과장·축소 없이 사실대로인가(보안 보고서의 과장은 신뢰를 무너뜨리고, 축소는 위험을 남긴다). 끝에 VERDICT: PASS|FAIL."
  - id: 10
    name: Wiki Update
    profile: curator
    upstream: [9]             # 게이트: 9 PASS 시 unblock
