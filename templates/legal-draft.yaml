# 아키타입 H — 법률 문서 초안(계약서·의견서·자문서·약관) (11단계)
# 출처: other_projects/harness-templates/domain-harnesses/project_legalforge
#       (.claude/skills/legalforge/SKILL.md 8-stage + agents 13종). 변환 절차: docs/13
#
# ⚠️ **이 파이프라인의 산출물은 법률 자문이 아니다.** 법적 효력 발생(서명·등기·공증) 전
#    반드시 자격 있는 변호사의 검토를 받아야 하며, `legal_safety` 게이트가 고지 부재를
#    **자동 반려**한다.
#
# ⚠️ **개인정보는 초안에 넣지 않는다.** 이 저장소는 PUBLIC 이고 Deliver 단계가 커밋·push
#    한다. 당사자 주민등록번호·사업자등록번호가 초안에 남으면 그 순간 공개되고 되돌릴 수
#    없다. 초안은 플레이스홀더(`[갑의 사업자등록번호]`·`000-00-00000`)로 쓰고 실제 값은
#    저장소 밖에서 사람이 채운다. `legal_safety` 게이트가 평문 개인정보를 반려한다.
#    (원본은 `_personal/` 을 gitignore 하라고 **지시만** 한다 — 우리는 게이트로 승격했다.)
#
# 변환 판단(요약 — 상세·근거는 docs/13 §2·§5):
#  - 원본 게이트 2종을 이식했는데 **둘 다 통째로 고장나 있었다**(항상 FAIL — 자세한 것은
#    §5). `clause_completeness` 는 raw f-string 안의 `{1,3}` 이 보간돼 정규식이 깨졌고,
#    `law_citation_check` 는 법령명 캡처가 앞 문장을 삼켜 화이트리스트가 항상 빗나갔다.
#  - **게이트 1종 신설**: `legal_safety`(고지 강제 + 개인정보 평문 차단) — 위 ⚠️ 참조.
#  - stage 5 의 4 writer(contract/opinion/advisory/terms)는 "같은 사안을 문서 종류별로
#    쓴다"는 **같은 계약**이라 profile 이 아니라 `parallel: workers` → writer 1개.
#  - stage 7 의 3 비평가를 우리 두 검증 지점으로 재배치:
#      law-citation-check          → 6 Legal Verify(fact-checker) · 9 Document Review 재검
#      clause-completeness + tone  → 9 Document Review(reviewer)
#    신규 profile 0개.
#  - **검증 순서**: 법령 인용 검증(5)을 **구조 설계·집필 전에** 둔다. 틀린 법령이 4개 문서로
#    복제되면 재작업이 4배다(patent-spec·policy-brief 와 같은 논리).
#  - `standard_clause_lib.py` 의 조항 taxonomy 는 스크립트가 아니라 **템플릿 policy 소유**로
#    옮겼다(도메인마다 갈아끼운다 — §2⑦). `bundle_export.py`·`runs_state.py` 는 미이식.
#
# 스키마 규약은 templates/trend-report.yaml 머리말 참조.

name: legal-draft
category: legal
display_name: 법률 문서 초안(계약서·의견서·자문서·약관)
maturity: draft
keywords: [계약서, 법률, 약관, 의견서, 자문, 조항, 법령, contract, legal]
goal_kr: 거래·사안 맥락에서 출발해 관련 법령·판례를 조사하고 조항 구조를 설계한 뒤, 선택한 종류별 한국법 법률 문서 초안을 산출한다(변호사 검토 전제).
invariants: [scoping_gate, deliver_gate, writer_ne_reviewer, factchecker_ne_reader, revision_loop, sources_cited]

policy:
  source_balance_policy:
    # 법률 조사의 source_type = 근거의 성격. 법령만 보고 판례를 안 보면 실제 적용을 놓친다.
    categories: [statute, precedent, admin_rule, standard_clause]
    min_per_category:
      statute: 2          # 근거 법령
      precedent: 1        # 판례(해석의 실제)
      admin_rule: 0       # 행정해석·고시·가이드라인(권장)
      standard_clause: 1  # 표준계약서·표준약관
    hard_block_if_missing: true
  recency_policy:
    # ⚠️ 법령과 판례는 최신성 성격이 다르다. 법령은 **현행 개정본**이어야 하지만 판례는
    #    1990년대 전원합의체가 여전히 살아 있다. 그래서 비율 요구를 낮추고 hard block 을
    #    멀리 두되, seminal 예외로 오래된 선례를 살린다.
    cutoff_year_offset: -5
    recent_ratio: 0.5
    hard_block_year_offset: -40
    seminal_exceptions: true

  law_policy:
    allow_unknown: true      # 화이트리스트 미등재 = WARN(전문 법령은 정당하다). 검증자가 확인
    max_article_no: 1500     # 환각 조문 탐지(민법 최종 조문이 제1118조다)
    min_citations: 1         # 법령 근거가 하나도 없는 법률 문서는 초안이 아니다

  legal_safety_policy:
    require_disclaimer: true
    disclaimer_terms: ["변호사 검토", "법률 자문이 아닙니다", "자격 있는 변호사"]
    block_pii: true
    allow_placeholder: true

  clause_policy:
    # 원본 standard_clause_lib.py 의 하드코딩을 정책으로 옮긴 것. 도메인이 바뀌면 여기만 고친다.
    doc_types: [contract]                 # SCOPE.md frontmatter 의 doc_types 가 우선
    domain: general                       # general | it_sw | research | employment
    required_clauses:
      contract: [당사자, 정의, 목적, 의무, 대가, 기간, 비밀유지, 손해배상, 해지, 분쟁해결, 서명]
      opinion:  [사실관계, 쟁점, 적용법령, 분석, 결론]
      advisory: [의뢰사항, 분석, 권고, 한계, 비밀유지]
      terms:    [적용범위, 정의, 의무, 면책, 분쟁해결, 개정]
    domain_clauses:
      contract:
        general: []
        it_sw: [라이센스 범위, 데이터 처리 및 개인정보 보호, 보안 사고 통지]
        research: [저작권, 공동연구 분담, IRB]
        employment: [근로조건, 임금, 휴가, 경업금지]
      terms:
        general: []
        it_sw: [개인정보 처리방침, 보안 사고 통지]
    aliases:
      # 실무에서 쓰는 다른 이름을 인정한다 — 이름이 다르다고 조항이 없는 것이 아니다.
      당사자: [계약당사자, 계약 당사자]
      정의: [용어의 정의, 용어 정의]
      목적: [계약의 목적, 계약 목적]
      의무: [권리와 의무, 권리·의무, 당사자의 의무]
      대가: [대금, 계약금액, 용역대금, 보수, 지급]
      기간: [계약기간, 계약 기간, 유효기간]
      비밀유지: [기밀유지, 비밀 유지, 비밀유지의무]
      손해배상: [배상책임, 손해배상 및 면책, 책임]
      해지: [해제 및 해지, 계약의 해지, 해제]
      분쟁해결: [분쟁 해결, 준거법 및 관할, 관할, 재판관할]
      서명: [서명 및 날인, 기명날인, 체결]
      적용범위: [적용 범위]
      면책: [면책 및 책임제한, 책임의 제한, 책임 제한]
      개정: [약관의 개정, 개정 및 공지, 변경]
      사실관계: [사실 관계, 사안의 개요]
      쟁점: [법적 쟁점, 검토 쟁점]
      적용법령: [관련 법령, 적용 법령, 근거 법령]
      분석: [법률 분석, 검토, 법적 검토]
      결론: [결론 및 의견, 의견]
      의뢰사항: [자문 의뢰사항, 의뢰 사항]
      권고: [권고사항, 조치 권고]
      한계: [한계 및 유의사항, 유의사항, 본 자문의 한계]

stages:
  - id: 1
    name: Scoping
    profile: default          # Solomon
    sam_gate: true
    upstream: []
    body: "작성 범위를 확정해 reports/<MID>/SCOPE.md 에 작성 — 사안 개요 · 당사자 **역할**(갑·을, 개인/법인 구분만) · 거래 요지 · 마감 · 완료조건. ⚠️ **frontmatter 에 `doc_types: [contract, ...]` 와 `domain: general|it_sw|research|employment` 를 반드시 선언**하라(객관 게이트가 이 선언으로 문서 존재와 필수 조항을 검사한다). ⚠️ **실제 개인정보(주민등록번호·사업자등록번호·계좌·주소 상세)를 SCOPE.md 나 이후 어떤 산출물에도 적지 마라** — 이 저장소는 PUBLIC 이고 Deliver 가 push 한다. 플레이스홀더(`[갑의 사업자등록번호]`)로 쓰고 실제 값은 Sam 이 저장소 밖에서 채운다. ⚠️ 파이프라인 카드는 이미 생성돼 있다 — 하위 task를 새로 만들거나 kanban decompose 하지 마라. 오직 SCOPE.md 산출과 이 task 완료만."
  - id: 2
    name: Context Intake
    profile: reader
    upstream: [1]
    body: "사안을 구조화해 context.md 에 정리 — 당사자 역할과 지위(개인/법인·사업 영역) · 거래 구조(무엇을·얼마에·언제까지·산출물은 무엇인가) · 각 당사자가 지는 위험 · 기존 관련 문서 · **불명확한 지점 목록**. ⚠️ Sam 이 말하지 않은 조건을 지어내지 마라 — 계약서의 빈칸을 상상으로 채우면 실제와 다른 문서가 된다. 불명확하면 `[확인 필요: …]` 로 남긴다. ⚠️ 개인정보는 플레이스홀더로만."
  - id: 3
    name: Legal Research
    profile: scout
    upstream: [2]
    parallel:
      mode: workers
      # 근거의 성격별 분할 = 산출 taxonomy. source_balance 게이트가 그대로 셀 수 있다.
      workers: [statute, precedent, admin_rule, standard_clause]
      batch_size: 3          # 4워커 = 3 + 1, 2라운드
      shard: "raw/sources.<worker>.yaml"
      merge_to: "raw/sources.yaml"
    body: "자기 유형의 법적 근거를 수집한다(statute=근거 법령 조문 · precedent=판례(사건번호·법원·선고일) · admin_rule=행정해석·고시·가이드라인 · standard_clause=공정위 표준계약서·표준약관 등). 각 항목 id·title·**법령명과 조문**(`민법 제105조` 표준 형식)·published_year(제정/개정/선고 연도)·url·source_type(=자기 워커명)·status·summary(요지 1~2문장) 기록. ⚠️ **법령명과 조문 번호를 지어내지 마라** — 객관 게이트가 형식과 조문 번호 타당성을 검사하고, 검증 단계가 실재를 확인한다. 확인 못 한 것은 status=unverified 로 남겨라. ⚠️ 현행 개정본인지 확인하라(폐지·전부개정된 법을 인용하는 것이 대표적 사고다)."
  - id: 4
    name: Dedup·Relevance
    profile: curator
    upstream: [3]
    body: "중복 제거 후 사안과의 관련성으로 선별. status=selected/excluded 와 사유 기록. **쟁점별로 근거를 묶어라**(각 쟁점에 법령 + 판례가 함께 붙는 것이 이상적이다). 배제 후 유형별 잔여 건수를 표로 남겨라 — 판례가 0건이 되면 균형 게이트가 반려한다."
  - id: 5
    name: Legal Verify
    profile: fact-checker      # ≠ curator
    verifier: true
    upstream: [4]
    gate:
      objective: [law_citation, source_balance, recency_check]
      llm: fact_checker_verdict
      draft: "reports/<MID>/raw/sources.yaml"
    body: "① **법령이 실재하고 현행인가** — 법령명이 정확한 공식 명칭인가, 조문 번호가 실제 그 내용인가, 폐지·전부개정되지 않았는가(객관 게이트는 형식과 번호 범위만 본다). ② **판례 인용이 정확한가** — 사건번호·법원·선고일이 맞고, 요지가 실제 판시사항과 일치하는가(판례 요지의 왜곡은 법률 문서의 대표적 오류다). ③ 표준계약서 조항을 원문 그대로 옮겼는가. ④ 화이트리스트 미등재 법령의 실재를 개별 확인하라(게이트는 WARN 만 낸다). 끝에 VERDICT: PASS|FAIL. ⚠️ 여기서 잡지 못하면 틀린 법령이 문서 종류 수만큼 복제된다."
  - id: 6
    name: Structure Design
    profile: synthesizer
    upstream: [5]              # 게이트: 5 PASS 시 게이트키퍼가 unblock
    body: "문서 종류별 **조항 구성**을 structure.md 에 설계 — SCOPE.md 의 `doc_types`·`domain` 에 따라 필수 조항 + 도메인 추가 조항을 배열하고, 각 조항마다 **근거(법령·판례 id)와 이 사안에서의 쟁점**을 붙인다. ⚠️ 조항 이름은 정책의 표준 명칭 또는 인정 별칭을 써라(객관 게이트가 절 제목으로 검사한다 — '## 제5조 (해지)' 또는 '### 해지'). ⚠️ 이 사안 고유의 위험(예: 산출물 지식재산권 귀속, 하도급 여부)에 대응하는 조항이 표준 목록에 없으면 **추가하라** — 표준은 하한이지 상한이 아니다."
  - id: 7
    name: Doc Write
    profile: writer
    sam_gate: true             # 문서 4종을 다시 쓰는 비용이 크다 — 집필 개시 전 조항 구성 승인
    approval_artifact: "reports/<MID>/structure.md"
    upstream: [6]
    parallel:
      mode: workers
      # 문서 종류마다 같은 계약(같은 사안을 종류별 서식으로 쓴다) = profile 아님, 워커다.
      workers: [contract, opinion, advisory, terms]
      batch_size: 3            # 4워커 = 3 + 1, 2라운드
      shard: "docs/<worker>.md"
      merge_to: null           # 문서는 병합 대상이 아니다 — 각자 독립 산출물
    body: "SCOPE.md 의 `doc_types` 에 **선언된 종류만** 작성한다(선언 안 된 워커는 건너뛴다). 공통 규칙: 본문 한국어 **격식체**(~한다 / ~하여야 한다) · 조항은 **절 제목**으로(`## 제N조 (해지)`) · 법령 인용은 `법령명 제N조 제M항` 표준 형식 · 금액은 한글 병기(`일천만원(10,000,000원)`) · **모든 문서 말미에 고지**('본 문서는 법률 자문이 아닙니다. 법적 효력 발생 전 자격 있는 변호사 검토 필수.'). 종류별: **contract**=계약서(structure.md 의 조항 전부) · **opinion**=법률 의견서(사실관계·쟁점·적용법령·분석·결론) · **advisory**=자문서(의뢰사항·분석·권고·한계·비밀유지) · **terms**=약관(적용범위·정의·의무·면책·분쟁해결·개정). ⚠️ **개인정보는 플레이스홀더로만 쓴다**(`[갑의 사업자등록번호]`) — 실제 값을 쓰면 객관 게이트가 반려한다. ⚠️ 모호한 표현('적절히', '상당한 기간')을 피하고 기준을 수치로 적어라."
  - id: 8
    name: Risk Disclosure
    profile: synthesizer
    upstream: [7]
    body: "작성된 문서를 놓고 **위험을 식별**해 risk.md 에 정리 — ① 각 당사자에게 불리한 조항과 그 크기 · ② 빠진 면책·책임한도·불가항력 조항 · ③ 강행규정 위반 소지(근로기준법·약관규제법 등은 당사자 합의로 배제할 수 없다) · ④ 분쟁 시 입증 부담이 어디에 있는가 · ⑤ 추가 권고 조항. ⚠️ 이 단계는 **문서를 고치지 않는다** — 위험을 드러내는 보고서다. 수정이 필요하면 검증 단계의 반려로 이어진다."
  - id: 9
    name: Document Review
    profile: reviewer          # ≠ writer
    verifier: true
    upstream: [8]
    gate:
      objective: [clause_completeness, legal_safety, law_citation]
      llm: reviewer_verdict
      draft: "reports/<MID>/docs"
    body: "독립 검토: ① **조항 완전성의 실질**(객관 게이트는 절 제목 존재만 본다 — **그 조항의 내용이 실제로 그 조항인지**는 네가 읽는다. '해지' 제목 아래 해지 사유가 없으면 빈 조항이다). ② **조항 간 모순**(기간 조항과 해지 조항이 충돌하지 않는가, 준거법과 관할이 어긋나지 않는가). ③ **문체·용어** — 격식체 일관성, 법률 용어 정확성, 모호한 표현('적절히'·'상당한')이 남아 있지 않은가. ④ **문서 종류 간 일치** — 같은 사안인데 의견서의 결론과 계약서 조항이 어긋나지 않는가. ⑤ risk.md 가 지적한 위험이 반영됐거나 최소한 고지됐는가. ⑥ **고지·개인정보**(게이트가 기계 검사하지만 우회 표기가 없는지 본다). 끝에 VERDICT: PASS|FAIL."
  - id: 10
    name: Wiki Update
    profile: curator
    upstream: [9]             # 게이트: 9 PASS 시 unblock
    body: "법률 영역 지형(도메인별 필수 조항 패턴·자주 쓰는 법령과 조문·판례 지도·조항 문구 사례)을 llm-wiki 에 반영(entities/concepts) + reflection + 재사용률 갱신. 같은 도메인의 다음 문서에서 법령 조사와 조항 구성을 재사용할 수 있게 정리한다."
  - id: 11
    name: Deliver
    profile: default          # Solomon
    sam_gate: true
    approval_artifact: "reports/<MID>/docs/contract.md"
    upstream: [10]
    body: "① 번들 조립 `reports/<MID>/legal-bundle/`: docs/*.md 전부 · clause-coverage.md(조항 충족 표) · risk.md · law-citations.md(인용 법령·판례 목록과 출처) · **usage-disclaimer.md(필수)** · fill-in-guide.md(**플레이스홀더 목록과 채워 넣을 값 안내** — 실제 개인정보는 여기에도 적지 않는다). ② 커밋 + git push(컨테이너 GITHUB_TOKEN 자격) + Slack 요약. ⚠️ **push 전에 개인정보 평문이 없는지 다시 확인하라** — 저장소는 PUBLIC 이고 push 는 되돌릴 수 없다. ⚠️ Slack 요약에 '변호사 검토 필수'를 명시하라. ⚠️ Slack 게시는 반드시 `hermes send --to slack:#mission-log \"<요약+커밋링크>\"`(Web API)로 하라 — 에이전트 slack 도구는 인바운드 Socket Mode 어댑터에 의존해 실패할 수 있다(현재 flapping)."
