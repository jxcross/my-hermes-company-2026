# 아키타입 A — 연구·기술 동향보고서 (11단계)
# 선언적 미션 파이프라인 템플릿. scripts/instantiate_template.py 가 이 파일을 읽어
# Kanban task 그래프(미션별 M-2026-NNN)로 번역한다. 설계: docs/11_template_driven_missions.md
#
# 규약:
#  - stages[].id       : 단계 번호(제목 접두 "MID · <id> <name>"에 사용)
#  - stages[].profile  : 담당 Hermes 프로필(=assignee)
#  - stages[].upstream : 선행 stage id 목록(→ hermes kanban link 로 의존/게이트)
#  - stages[].sam_gate : true 면 block --kind needs_input(사람 승인 대기)
#  - stages[].verifier : true 면 검증자 단계(작성자≠검증자 불변식 대상). downstream 은
#                        인스턴스화 시 --initial-status blocked 로 생성되고 게이트키퍼가 PASS 시 unblock.
#  - stages[].gate     : 검증자 단계의 이중 게이트 선언
#       objective       : scripts/gates/<name>.py 목록(객관 Python, exit 0/1)
#       llm             : gate_keeper 가 파싱할 LLM 검증자 신호(VERDICT)
#       draft           : 객관 게이트 --draft 로 넘길 산출물 경로(선택, <MID> 치환)
#  - stages[].parallel : 스테이지 내 subagent 병렬 팬아웃(선택). 번역기가 이 선언을 읽어
#       task 본문에 팬아웃 프로토콜을 주입한다(스테이지 카드는 여전히 1개; delegation 배치 위임).
#       mode: workers  → 고정 목록. workers:[…] 마다 subagent 1개. shard=워커별 파일.
#       mode: per_item → 동적 분할. over: 로 분할 기준 서술, 항목마다 subagent 1개.
#       shard    : 워커/항목별 산출 파일 패턴(<worker>·<id>·<section> 치환은 실행 profile 담당).
#       merge_to : 오케스트레이터가 모든 subagent 반환 후 병합·dedup 하는 canonical 파일.
#       batch_size : delegation 배치 1회당 최대 subagent 수(기본 3 = Hermes
#                    `delegation.max_concurrent_children` 기본값). Hermes 는 배치가 이 값을
#                    넘으면 큐잉하지 않고 tool_error 로 **거절**하므로, 초과분은 라운드로
#                    나눠야 한다. 번역기가 "N개씩 몇 라운드"를 본문에 명시해 모델 추측을 없앤다.
#                    컨테이너 config 를 올렸다면 여기 값도 함께 올릴 것.

name: trend-report
category: research
display_name: 연구·기술 동향보고서
# 이 파일이 스키마 원본이라 maturity 규약(docs/12 §6)보다 먼저 만들어졌고, 그래서 필드가
# 없었다. 실적은 사다리를 이미 만족한다 — 실미션 **2회 완주**(M-2026-003 · M-2026-004).
maturity: proven           # draft → (실미션 1회) tested → (2회) proven
keywords: [동향, 트렌드, 최신, 조사, 서베이, 기술동향, 연구동향, landscape, trend, survey]
goal_kr: 지정 주제의 최신 연구·기술 동향을 출처 검증된 Markdown 보고서로 산출한다.
invariants: [scoping_gate, deliver_gate, writer_ne_reviewer, factchecker_ne_reader, revision_loop, sources_cited]

# 미션 스코프(SCOPE.md frontmatter)로 해석될 기본 정책. Scoping 에서 미션별로 조정.
policy:
  recency_policy:
    cutoff_year_offset: -2       # 현재년 기준. cutoff_year = now + offset (>= 이면 recent)
    recent_ratio: 0.6            # 인용 중 recent 비율 하한
    hard_block_year_offset: -5   # 이 미만은 seminal 태그 없으면 금지
    seminal_exceptions: true
  source_balance_policy:
    # 우리 도메인 taxonomy(하드코딩 아님 — 여기 선언값을 게이트가 읽음)
    categories: [academic, vendor, research_org, standards, news]
    min_per_category:
      academic: 2      # arXiv/논문/preprint
      vendor: 2        # 공식 블로그/system card/엔지니어링(OpenAI·Anthropic·MS·LangChain·IBM)
      research_org: 1  # 독립 연구기관(METR 등)
      standards: 0     # IETF/NIST 등(선택)
      news: 0          # 언론(선택)
    hard_block_if_missing: false  # 0 지정 카테고리는 누락 허용

stages:
  - id: 1
    name: Scoping
    profile: default          # Solomon
    sam_gate: true
    upstream: []
    body: "미션 스펙(목표·완료조건·제약·N) + recency/source_balance 정책을 reports/<MID>/SCOPE.md에 작성. ⚠️ 파이프라인 카드는 이미 생성돼 있다 — 하위 task를 새로 만들거나 kanban decompose 하지 마라(중복 방지). 오직 SCOPE.md 산출과 이 task 완료만."
  - id: 2
    name: Search Strategy
    profile: scout
    upstream: [1]
    body: "검색식·소스 목록·기간·출처유형 분배."
  - id: 3
    name: Collection
    profile: scout
    upstream: [2]
    parallel:
      mode: workers
      workers: [academic, vendor, research_org, standards, news]
      batch_size: 3          # 5워커 = 3 + 2, 2라운드
      shard: "raw/sources.<worker>.yaml"
      merge_to: "raw/sources.yaml"
    body: "source_type별 원자료 수집. 각 항목 id·published_year·source_type·url·collected_at·status 기록."
  - id: 4
    name: Dedup·Relevance
    profile: curator
    upstream: [3]
    body: "중복 제거·관련성 선별. sources.yaml status 갱신."
  - id: 5
    name: Deep Analysis
    profile: reader
    upstream: [4]
    parallel:
      mode: per_item
      over: "raw/sources.yaml 의 status=selected 자료 각각"
      batch_size: 3
      shard: "analysis/<id>.md"
      merge_to: "analysis/_index.md"
    body: "자료별 주장/근거 분리 분석."
  - id: 6
    name: Cross-Verify
    profile: fact-checker      # ≠ reader
    verifier: true
    upstream: [5]
    gate:
      objective: [recency_check, source_balance]
      llm: fact_checker_verdict
      draft: null              # draft 미생성 단계 — sources 기준 검사
    body: "핵심 주장 독립출처 교차검증. 끝에 VERDICT: PASS|FAIL."
  - id: 7
    name: Synthesis
    profile: synthesizer
    upstream: [6]              # 게이트: 6 PASS 시 게이트키퍼가 unblock
    body: "기술 분류·성숙도·적용 후보."
  - id: 8
    name: Report Draft
    profile: writer
    upstream: [7]
    parallel:
      mode: per_item
      over: "보고서 섹션(개요·기술분류·성숙도·적용후보·결론 등 7단계 종합 기준)"
      batch_size: 3
      shard: "report.<section>.md"
      merge_to: "report.md"
    body: "출처 포함 Markdown 보고서(report.md)."
  - id: 9
    name: Independent Review
    profile: reviewer          # ≠ writer
    verifier: true
    upstream: [8]
    gate:
      objective: [recency_check, source_balance]
      llm: reviewer_verdict
      draft: "reports/<MID>/report.md"
    body: "완료조건 대비 독립 검토. 끝에 VERDICT: PASS|FAIL."
  - id: 10
    name: Wiki Update
    profile: curator
    upstream: [9]             # 게이트: 9 PASS 시 unblock
    body: "raw→llm-wiki 반영 + reflection + 재사용률 갱신."
  - id: 11
    name: Deliver
    profile: default          # Solomon
    sam_gate: true
    upstream: [10]
    body: "보고서 커밋 + git push(컨테이너 GITHUB_TOKEN 자격으로 origin) + Slack 요약. ⚠️ Slack 게시는 반드시 `hermes send --to slack:#mission-log \"<요약+커밋링크>\"`(Web API)로 하라 — 에이전트 slack 도구는 인바운드 Socket Mode 어댑터에 의존해 실패할 수 있다(현재 flapping)."
