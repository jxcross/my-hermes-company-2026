# Solomon (AI CEO) — 이 프로젝트 전용 격리 Hermes 인스턴스
#
# ⚠️ 격리 원칙:
#  - 호스트 ~/.hermes (다른 프로젝트: ainc-hermes 등)와 절대 공유하지 않는다.
#  - 데이터는 이 repo의 ./hermes-home 에만 저장(/opt/data 로 마운트).
#  - 컨테이너명·포트를 기존 스택(ainc-hermes: 8642/9219 등)과 충돌하지 않게 고유화.
#
# 사용:
#   1) .env.example → .env 복사 후 키 입력 (ANTHROPIC/OPENAI, SLACK_*)
#   2) 초기 설정(대화형):  docker compose run --rm hermes-solomon setup
#   3) 게이트웨이 기동:     docker compose up -d
#   4) 대시보드(게시판):   http://localhost:9129   (API: http://localhost:8652)

services:
  hermes-solomon:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-solomon
    restart: unless-stopped
    command: gateway run
    env_file:
      - .env
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      # 에이전트 파일쓰기 허용 범위 = 마운트된 볼륨 3개와 일치(맥 나머지는 격리).
      # 워커가 회사 repo(모든 미션 산출물)·llm-wiki에 직접쓰기 → 복사 불필요.
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/work/company:/work/llm-wiki
      # Curator의 karpathy-llm-wiki 스킬이 지식을 적재할 위치(마운트된 llm-wiki repo).
      - WIKI_PATH=/work/llm-wiki
      # Deliver(git push) 자격: .env 의 GITHUB_TOKEN(env_file 로 자동 주입)을 읽는 credential
      # helper 를 github.com HTTPS 에 주입. 토큰은 파일에 저장 안 함(env 런타임 조회). GIT_CONFIG_*
      # 는 .git/config(신원 user.email) 위에 *추가*만 하므로 커밋 신원은 보존. compose 는 $$→$ 로
      # 이스케이프해 helper 가 실행 시점에 $GITHUB_TOKEN 을 셸 확장하게 한다.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=credential.https://github.com.helper
      - 'GIT_CONFIG_VALUE_0=!f() { echo username=x-access-token; echo "password=$$GITHUB_TOKEN"; }; f'
    ports:
      - "127.0.0.1:8652:8642"   # gateway/API (호스트 8652 → 컨테이너 8642)
      - "127.0.0.1:9129:9119"   # 웹 대시보드=게시판 (호스트 9129 → 컨테이너 9119)
    volumes:
      - ./hermes-home:/opt/data                                # 격리 Hermes 홈(profiles·kanban·sessions·memories·config·SOUL)
      - ../my-hermes-company-llm-wiki-2026:/work/llm-wiki       # LLM Wiki repo (지식 자산)
      - ./:/work/company                                       # 회사 repo (보고서 산출물)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # 반려 게이트 자동화(게이트키퍼) — 검증 task(6·9) 판정이 FAIL 이면 산출물 재작업
  # 루프(리비전→재검증)를 강제하고, 다음 단계(7·10)를 PASS 전까지 보류한다.
  #  - 같은 kanban 데이터(./hermes-home)를 공유해 **활성 보드를 전부** 폴링한다
  #    (scripts/gate_keeper.py `active_boards()`). 미션마다 보드를 새로 만들므로
  #    (기본 보드 default + 미션별 보드) 단일 보드 가정을 두면 다른 보드의 미션은
  #    검증 게이트가 영영 안 돌고 로그도 안 남는다.
  #    ⚠️ 여기에 HERMES_KANBAN_BOARD 를 걸지 마라 — 사이드카를 **한 보드에 고정**하는
  #       것이라 정확히 반대 효과다. 보드 지정은 호출마다 `--board` 로 한다.
  #  - entrypoint 를 python 으로 덮어 s6/gateway 대신 게이트키퍼만 실행(이미지 내 hermes
  #    CLI 로 kanban 조작·Slack 통지). 활성 게이트만 처리 → 완료 미션 재처리 안 함.
  hermes-gatekeeper:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gatekeeper
    restart: unless-stopped
    depends_on:
      - hermes-solomon
    entrypoint: ["python3", "/work/company/scripts/gate_keeper.py"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1   # docker logs 로 게이트키퍼 폴 로그 즉시 확인
    volumes:
      - ./hermes-home:/opt/data
      - ./:/work/company
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
